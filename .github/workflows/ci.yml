name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: colcon build + lint + test (Humble)
    runs-on: ubuntu-latest
    container:
      image: rostooling/setup-ros-docker:ubuntu-jammy-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and test workspace
        id: action_ros_ci
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: urdf_live_editor urdf_ai_agents
          target-ros2-distro: humble
          # colcon defaults run `colcon build` + `colcon test`, and the
          # per-package ament lint tests (ament_flake8, ament_pep257,
          # ament_copyright) plus pytest all run under `colcon test`.
          import-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload colcon logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colcon-logs
          path: ${{ steps.action_ros_ci.outputs.ros-workspace-directory-name }}/log
          if-no-files-found: ignore
